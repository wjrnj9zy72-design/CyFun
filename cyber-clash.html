<title>Cyber Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: game screen. HUD of resources on top, isometric village (SVG) beside a context panel; big-screen tab for projection. Single deliberate game look, colors set explicitly. */
:root {
  --sky: #bfe0f2;
  --sky-deep: #8cc6e6;
  --board: #fffaf0;
  --ink: #2a2118;
  --muted: #6b5d4d;
  --line: #e2d3b8;
  --wood: #8a5a2b;
  --wood-dark: #5e3b17;
  --gold: #f0b429;
  --gold-dark: #b7830e;
  --red: #d2452f;
  --red-bg: #fbe3dd;
  --green: #2f8f46;
  --green-bg: #def2e2;
  --blue: #2c6ea8;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: linear-gradient(var(--sky-deep), var(--sky) 320px); color: var(--ink); font: 16px/1.45 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; padding-block: 16px 60px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 2.1rem; color: #fff; -webkit-text-stroke: 1.5px var(--wood-dark); paint-order: stroke fill; text-shadow: 0 3px 0 var(--wood-dark); }
h2 { font-size: 1.35rem; color: var(--wood-dark); }
h3 { font-size: 1.08rem; }
button { font-family: var(--f-body); }
button:focus-visible, select:focus-visible, input:focus-visible, [data-b]:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.brand { display: grid; gap: 4px; min-width: 0; }
.brand small { font-weight: 800; color: var(--wood-dark); font-size: 0.85rem; }
.tabs { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font-weight: 800; font-size: 0.95rem; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--wood-dark); background: var(--board); color: var(--wood-dark); cursor: pointer; box-shadow: 0 3px 0 var(--wood-dark); }
.tabs button[aria-selected="true"] { background: var(--gold); }

.banner { margin-top: 14px; padding: 10px 16px; border-radius: 14px; background: var(--wood-dark); color: var(--board); display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; box-shadow: 0 4px 0 #3d260e; }
.banner b { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; color: var(--gold); letter-spacing: 0.02em; }
.status { margin-top: 8px; font-size: 0.82rem; font-weight: 700; color: var(--wood-dark); min-height: 1.2em; }

.hud { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
.hud label { display: grid; gap: 3px; font-size: 0.78rem; font-weight: 800; color: var(--wood-dark); }
select, input[type="text"], input[type="number"] { font: 700 1rem var(--f-body); color: var(--ink); background: var(--board); border: 2px solid var(--wood); border-radius: 10px; padding: 6px 10px; }
.hud input[type="text"] { width: 190px; max-width: 100%; }
.spacer { flex: 1; }
.pill { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 4px; background: rgba(42, 33, 24, 0.82); color: #fff; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; border: 2px solid rgba(255, 255, 255, 0.5); }
.pill svg { width: 32px; height: 32px; flex: none; }
.pill.neg { color: #ffb4a8; }
.pill.late { background: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.6; } }
.pill .fly { position: absolute; left: 36px; top: -4px; font: 400 1rem var(--f-display); color: var(--gold); -webkit-text-stroke: 1px var(--wood-dark); paint-order: stroke fill; animation: fly 1.1s ease-out forwards; pointer-events: none; }
.pill .fly.plus { color: #9ef0a6; }
@keyframes fly { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
.sound { height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, 0.5); background: rgba(42, 33, 24, 0.82); color: #fff; font-weight: 800; cursor: pointer; }

.game { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: minmax(0, 1fr); } }
.stage-box { position: relative; min-width: 0; border-radius: 22px; overflow: hidden; border: 4px solid var(--wood-dark); box-shadow: 0 6px 0 #3d260e; background: #3fa7d6; }
.stage-box svg.world { overflow: hidden; }
.wave { animation: wave 3.4s ease-in-out infinite; transform-box: fill-box; }
@keyframes wave { 0%, 100% { transform: translateX(0); opacity: 0.15; } 50% { transform: translateX(9px); opacity: 0.85; } }
.foam { stroke-dasharray: 16 10; animation: march 4s linear infinite; }
.cloud { animation: cloud 80s linear infinite; }
@keyframes cloud { from { transform: translateX(-620px); } to { transform: translateX(620px); } }
.boat { animation: boat 40s ease-in-out infinite alternate; }
@keyframes boat { from { transform: translate(0, 0); } to { transform: translate(150px, 75px); } }
.led { animation: led 1.1s steps(2) infinite; }
@keyframes led { 50% { opacity: 0.2; } }
.pulse { animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
.wave-flag { animation: flagw 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 50%; }
@keyframes flagw { 50% { transform: skewY(10deg) scaleX(0.85); } }
#tint { opacity: 0; transition: opacity 0.6s; }
svg.world.raid #tint { opacity: 1; }
#tint rect { animation: alarm 1.4s ease-in-out infinite; }
@keyframes alarm { 50% { opacity: 0.35; } }
svg.world.raid #layer-walkers { display: none; }
.shake { animation: shake 0.45s; }
@keyframes shake { 20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -2px); } }
.raid-intro { position: absolute; left: 0; right: 0; top: 36%; display: grid; justify-items: center; gap: 2px; padding: 14px 16px; text-align: center; background: linear-gradient(90deg, transparent, rgba(165, 25, 12, 0.94) 12%, rgba(165, 25, 12, 0.94) 88%, transparent); color: #fff; animation: intro 3s ease-in-out forwards; pointer-events: none; }
.raid-intro b { font: 400 2.1rem/1 var(--f-display); letter-spacing: 0.06em; -webkit-text-stroke: 1.5px #3d0b05; paint-order: stroke fill; }
.raid-intro span { font-weight: 800; }
@keyframes intro { 0% { transform: translateX(-110%); } 14% { transform: translateX(0); } 86% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(110%); opacity: 0; } }
.result .card.event h2 { color: var(--blue); }
.delta { font: 400 1.7rem var(--f-display); margin: 0; }
.delta.plus { color: var(--green); } .delta.minus { color: var(--red); }
.why.power { color: var(--red); }
/* alerte de nuit pendant un raid */
svg.world #layer-bg, svg.world #layer-world { transition: filter 0.8s; }
svg.world.raid #layer-bg { filter: brightness(0.45) saturate(0.7) hue-rotate(10deg); }
svg.world.raid #layer-world { filter: brightness(0.62) saturate(0.85); }
svg.world.raid .win polygon { fill: #ffe27a; }
svg.world.raid .cloud { opacity: 0.3; transition: opacity 0.8s; }
svg.world.raid .win { filter: drop-shadow(0 0 3px #ffb300); }
.beam { animation: sweep 5s ease-in-out infinite alternate; }
.beam.b2 { animation-duration: 6.5s; animation-delay: -2s; }
@keyframes sweep { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }
.birds { animation: birds 38s linear infinite; }
@keyframes birds { from { transform: translate(0, 0); } to { transform: translate(760px, -60px); } }
.flap { animation: flap 0.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes flap { to { transform: scaleY(0.4); } }
.twinkle { animation: twinkle 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.3); } 50% { opacity: 0.9; transform: scale(1); } }
.sway { animation: sway 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
.aura { animation: aura 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes aura { from { opacity: 0.5; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }
[data-b] .bld { transition: transform 0.18s ease, filter 0.18s ease; }
[data-b]:hover .bld, [data-b]:focus-visible .bld { transform: translateY(-4px); filter: brightness(1.08) drop-shadow(0 0 5px #fff6c2); }
/* habillage */
.crest { width: 54px; height: 60px; flex: none; filter: drop-shadow(0 3px 0 var(--wood-dark)); }
.brand-row { display: flex; gap: 12px; align-items: center; min-width: 0; }
.panel { background: linear-gradient(180deg, #fffdf6, #f5e9cf); }
.pill { background: linear-gradient(180deg, rgba(60, 46, 32, 0.92), rgba(30, 22, 14, 0.92)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 3px 0 rgba(0, 0, 0, 0.25); }
.tabs button { background: linear-gradient(180deg, #fffdf6, #f1e2c4); }
.tabs button[aria-selected="true"] { background: linear-gradient(180deg, #ffd35c, #f0b429); }
.banner { background: linear-gradient(180deg, #6e4620, #4f3113); border: 2px solid #3d260e; }
svg.world { display: block; width: 100%; height: auto; overflow: visible; }
svg.world text { font-family: var(--f-display); }
[data-b] { cursor: pointer; }
[data-b]:hover .bld { filter: brightness(1.08); }
.sel-ring { stroke-dasharray: 10 7; animation: march 0.9s linear infinite; }
@keyframes march { to { stroke-dashoffset: -17; } }
.pop { animation: pop 0.7s cubic-bezier(0.3, 1.7, 0.5, 1); transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes pop { from { transform: scale(0.1); } to { transform: scale(1); } }
.flame { animation: flick 0.35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.flame.b { animation-duration: 0.5s; }
@keyframes flick { from { transform: scale(0.85, 0.8); } to { transform: scale(1.05, 1.15); } }
.smoke { animation: smoke 2.6s linear infinite; transform-box: fill-box; transform-origin: center; }
.smoke.d2 { animation-delay: 0.9s; } .smoke.d3 { animation-delay: 1.7s; }
@keyframes smoke { from { transform: translate(0, 0) scale(0.6); opacity: 0.75; } to { transform: translate(6px, -40px) scale(1.8); opacity: 0; } }
.bob { animation: bob 0.3s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-3px); } }
.hitflash { animation: hitflash 0.25s 4 alternate; }
@keyframes hitflash { to { filter: brightness(1.7) sepia(1) hue-rotate(-40deg) saturate(4); } }
.bounce { animation: bounce 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bounce { 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.result { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20, 14, 8, 0.55); padding: 16px; }
.result .card { background: var(--board); border: 4px solid var(--wood-dark); border-radius: 20px; padding: 18px 22px; text-align: center; display: grid; gap: 10px; justify-items: center; max-width: 380px; animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); box-shadow: 0 8px 0 #3d260e; }
.result h2 { font-size: 1.9rem; }
.result h2.win { color: var(--green); } .result h2.lose { color: var(--red); }
.big-stars { display: flex; gap: 8px; }
.big-stars svg { width: 58px; height: 58px; }
.big-stars .on { animation: starin 0.45s cubic-bezier(0.3, 1.8, 0.5, 1) both; }
@keyframes starin { from { transform: scale(0) rotate(-60deg); } to { transform: scale(1) rotate(0); } }
.result p { margin: 0; font-weight: 800; }

.panel { background: var(--board); border: 3px solid var(--wood-dark); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; box-shadow: 0 5px 0 #3d260e; }
.panel .sub { color: var(--muted); font-size: 0.9rem; margin: 0; font-weight: 700; }
.obs { display: grid; gap: 8px; }
.obs button { text-align: left; font-size: 0.95rem; font-weight: 700; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: start; }
.obs button .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--wood); display: grid; place-items: center; font-size: 0.85rem; font-weight: 800; }
.obs button[aria-pressed="true"] { border-color: var(--red); background: var(--red-bg); }
.obs button[aria-pressed="true"] .box { background: var(--red); border-color: var(--red); color: #fff; }
.obs button:disabled { cursor: default; }
.verdict { display: block; font-size: 0.82rem; font-weight: 800; margin-top: 3px; }
.verdict.good { color: var(--green); } .verdict.bad { color: var(--red); } .verdict.miss { color: var(--gold-dark); }

.def { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; background: #fff; align-items: start; }
.def .icon { grid-row: span 3; width: 64px; height: 76px; background: #eef6e4; border-radius: 10px; }
.def-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.lvstars { display: inline-flex; gap: 2px; }
.lvstars svg { width: 18px; height: 18px; }
.lv-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 0.86rem; }
.lv-list li { display: flex; gap: 8px; align-items: baseline; color: var(--muted); }
.lv-list li.done { color: var(--ink); font-weight: 800; }
.lv-list li b { font-variant-numeric: tabular-nums; flex: none; width: 3.1em; color: var(--gold-dark); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font-weight: 800; font-size: 0.92rem; padding: 8px 14px; border-radius: 12px; border: 2px solid rgba(0, 0, 0, 0.25); cursor: pointer; }
.btn.gold { background: var(--gold); color: var(--wood-dark); box-shadow: 0 3px 0 var(--gold-dark); }
.btn.green { background: #5cc15f; color: #fff; box-shadow: 0 3px 0 #2f7d33; }
.btn.plain { background: var(--line); color: var(--wood-dark); }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 3px 0 #8f2a1b; }
.btn.blue { background: var(--blue); color: #fff; box-shadow: 0 3px 0 #1b4a73; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.why { font-size: 0.8rem; color: var(--muted); font-weight: 800; }

.raid { display: grid; gap: 10px; }
.raid .intro { margin: 0; font-weight: 800; }
.step { border-radius: 12px; padding: 10px 12px; border: 2px solid var(--line); background: #fff; display: grid; gap: 3px; }
.step .k { font: 400 0.8rem var(--f-display); letter-spacing: 0.04em; color: var(--muted); }
.step.win { border-color: var(--red); background: var(--red-bg); }
.step.block { border-color: var(--green); background: var(--green-bg); }
.step.off { opacity: 0.5; }
.step .res-line { font-size: 0.86rem; font-weight: 800; }
.step.win .res-line { color: var(--red); } .step.block .res-line { color: var(--green); }
.step .hint { font-size: 0.82rem; color: var(--muted); font-weight: 700; }

/* écran géant */
.giant-head { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.minis { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mini { background: var(--board); border: 3px solid var(--wood-dark); border-radius: 16px; padding: 8px 10px 10px; display: grid; gap: 4px; box-shadow: 0 4px 0 #3d260e; min-width: 0; }
.mini .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mini .top b { font: 400 1.05rem var(--f-display); overflow-wrap: anywhere; }
.mini .top span { font-weight: 800; font-size: 0.85rem; color: var(--blue); white-space: nowrap; }
.mini .steps { display: flex; gap: 4px; }
.mini .steps i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.mini .steps i.win { background: var(--red); } .mini .steps i.block { background: var(--green); }
.board-box { margin-top: 16px; background: var(--board); border: 3px solid var(--wood-dark); border-radius: 18px; overflow-x: auto; box-shadow: 0 5px 0 #3d260e; }
table.rank { border-collapse: collapse; width: 100%; min-width: 620px; font-variant-numeric: tabular-nums; }
.rank th, .rank td { padding: 9px 12px; border-bottom: 2px solid var(--line); text-align: center; font-weight: 700; }
.rank th { font: 400 0.85rem var(--f-display); letter-spacing: 0.03em; color: var(--muted); }
.rank td.l, .rank th.l { text-align: left; }
.rank tr:last-child td { border-bottom: 0; }
.rank .pos { font: 400 1.25rem var(--f-display); color: var(--wood); }
.rank tr:first-child .pos { color: var(--gold-dark); }
.mini-stars { color: var(--gold-dark); letter-spacing: 1px; }
.mini-stars .z { color: var(--green); }
.debrief { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .debrief { grid-template-columns: minmax(0, 1fr); } }
.debrief .panel { gap: 8px; }
.debrief ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 0.9rem; }
.debrief .cnt { font-weight: 800; color: var(--green); }
.empty { margin-top: 16px; padding: 18px; border: 2px dashed var(--wood); border-radius: 14px; color: var(--muted); background: var(--board); font-weight: 700; }

/* maître du jeu */
.mj { margin-top: 16px; display: grid; gap: 16px; }
.mj .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.mj label { display: grid; gap: 3px; font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.mj input[type="number"] { width: 90px; }
.raid-pick { display: grid; gap: 8px; }
.raid-pick .it { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
.raid-pick .it .txt { min-width: 0; flex: 1 1 240px; }
.raid-pick .it .txt div { font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.raid-pick .it.done { opacity: 0.55; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 800; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand-row">
    <svg class="crest" viewBox="0 0 54 60" aria-hidden="true"><path d="M27 2 L51 10 V30 C51 45 40 54 27 58 C14 54 3 45 3 30 V10 Z" fill="#f0b429" stroke="#5e3b17" stroke-width="3"/><path d="M27 9 L44 15 V30 C44 41 37 48 27 51 C17 48 10 41 10 30 V15 Z" fill="#2c6ea8"/><rect x="19" y="27" width="16" height="13" rx="2" fill="#fffaf0"/><path d="M22 27 V22 A5 5 0 0 1 32 22 V27" fill="none" stroke="#fffaf0" stroke-width="3"/><circle cx="27" cy="33" r="2" fill="#2c6ea8"/></svg>
    <div class="brand">
      <h1>Cyber Clash</h1>
      <small>Atelier Boisvert SRL · menuiserie de 22 personnes · défendez-la avec les mesures CyFun Small</small>
    </div>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-base" role="tab" aria-selected="true">Ma base</button>
      <button id="tab-giant" role="tab" aria-selected="false">Écran géant</button>
      <button id="tab-mj" role="tab" aria-selected="false" hidden>Maître du jeu</button>
    </nav>
  </header>

  <div class="banner" id="banner"></div>
  <div class="status" id="status">Connexion à la partie…</div>

  <section id="view-base">
    <div class="hud">
      <label for="sel-table">Table <select id="sel-table"></select></label>
      <label for="in-name">Équipe <input type="text" id="in-name" maxlength="30" placeholder="Nom d'équipe"></label>
      <span class="spacer"></span>
      <span class="pill" id="r-gold"></span>
      <span class="pill" id="r-troph"></span>
      <span class="pill" id="r-hq"></span>
      <span class="pill" id="r-timer" hidden></span>
      <button class="sound" id="btn-sound" aria-pressed="false">Son : non</button>
    </div>
    <div class="game">
      <div class="stage-box" id="stage">
        <svg class="world" id="world" viewBox="-395 -95 790 510" role="group" aria-label="Village de l'Atelier Boisvert">
          <defs>
            <linearGradient id="g-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc3e8"/><stop offset="1" stop-color="#2a86bd"/></linearGradient>
            <linearGradient id="g-grass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a3d167"/><stop offset="1" stop-color="#76aa42"/></linearGradient>
            <linearGradient id="g-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7c0" stop-opacity="0.55"/><stop offset="1" stop-color="#fff7c0" stop-opacity="0"/></linearGradient>
            <radialGradient id="g-glow"><stop offset="0" stop-color="#fff6c2" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6c2" stop-opacity="0"/></radialGradient>
          </defs>

// ================= dessin isométrique =================
const TW = 84, TH = 42; // taille d'une case
const iso = (gx, gy) => [(gx - gy) * TW / 2, (gx + gy) * TH / 2];
const P = (a) => a.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255]
    .map((v) => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f));
  return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
}
const OUT = 'stroke="#2a2118" stroke-opacity="0.45" stroke-width="1.2" stroke-linejoin="round"';
function corners(X, Y, s) { return { N: [X, Y - s * TH], E: [X + s * TW, Y], S: [X, Y + s * TH], Wc: [X - s * TW, Y] }; }
const up = (p, h) => [p[0], p[1] - h];
function box(X, Y, s, h, col, top) {
  const { N, E, S, Wc } = corners(X, Y, s);
  return `<polygon points="${P([Wc, S, up(S, h), up(Wc, h)])}" fill="${shade(col, -0.28)}" ${OUT}/>` +
    `<polygon points="${P([S, E, up(E, h), up(S, h)])}" fill="${shade(col, -0.1)}" ${OUT}/>` +
    `<polygon points="${P([up(N, h), up(E, h), up(S, h), up(Wc, h)])}" fill="${top || shade(col, 0.18)}" ${OUT}/>`;
}
function roof(X, Y, s, h, r, col) {
  const { N, E, S, Wc } = corners(X, Y, s), a = [X, Y - h - r];
  return `<polygon points="${P([up(Wc, h), up(N, h), a])}" fill="${shade(col, 0.1)}" ${OUT}/>` +
    `<polygon points="${P([up(N, h), up(E, h), a])}" fill="${shade(col, 0.2)}" ${OUT}/>` +
    `<polygon points="${P([up(Wc, h), up(S, h), a])}" fill="${shade(col, -0.2)}" ${OUT}/>` +
    `<polygon points="${P([up(S, h), up(E, h), a])}" fill="${col}" ${OUT}/>` + tiles(up(Wc, h), up(S, h), a) + tiles(up(S, h), up(E, h), a);

// rangées de tuiles : lignes parallèles au bas du pan de toit
function tiles(A, B, apex) {
  let o = "";
  for (const t of [0.25, 0.5, 0.75]) {
    const p1 = [A[0] + (apex[0] - A[0]) * t, A[1] + (apex[1] - A[1]) * t], p2 = [B[0] + (apex[0] - B[0]) * t, B[1] + (apex[1] - B[1]) * t];
    o += `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>`;
  }
  return o;
}
function faceR(X, Y, s, u1, u2, t1, t2, fill) {
  const S = [X, Y + s * TH], E = [X + s * TW, Y], p = (u, t) => [S[0] + (E[0] - S[0]) * u, S[1] + (E[1] - S[1]) * u - t];
  return `<polygon points="${P([p(u1, t1), p(u2, t1), p(u2, t2), p(u1, t2)])}" fill="${fill}"/>`;
}
function faceL(X, Y, s, u1, u2, t1, t2, fill) {
  const A = [X - s * TW, Y], S = [X, Y + s * TH], p = (u, t) => [A[0] + (S[0] - A[0]) * u, A[1] + (S[1] - A[1]) * u - t];
  return `<polygon points="${P([p(u1, t1), p(u2, t1), p(u2, t2), p(u1, t2)])}" fill="${fill}"/>`;
}
function windowsRow(X, Y, s, n, t1, t2, fill) {
  let out = "";
  for (let i = 0; i < n; i++) {
    const u1 = (i + 0.25) / n, u2 = (i + 0.75) / n;
    out += faceR(X, Y, s, u1, u2, t1, t2, fill) + faceL(X, Y, s, u1, u2, t1, t2, shade(fill, -0.25));
  }
  return `<g class="win">${out}</g>`;
}

function emblem(d, x, y) {
  const c = DEFS[d].color, st = `stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const g = {
    gouv: `<path d="M-5 3 L-5 -3 L-2.5 0 L0 -4 L2.5 0 L5 -3 L5 3 Z" fill="${c}"/>`,
    incident: `<rect x="-1.2" y="-5" width="2.4" height="6" rx="1" fill="${c}"/><circle cx="0" cy="3.6" r="1.4" fill="${c}"/>`,
    access: `<circle cx="-2.2" cy="0" r="2.6" ${st}/><path d="M0.4 0 H5.5 M4 0 V2.5 M2.4 0 V2" ${st}/>`,
    aware: `<path d="M-5 -3 L0 -2 L5 -3 L5 3.5 L0 4.5 L-5 3.5 Z M0 -2 V4.5" ${st}/>`,
    fw: `<path d="M-5 -3.5 H5 V3.5 H-5 Z M-5 0 H5 M-1.5 -3.5 V0 M2 0 V3.5 M-3 0 V3.5" ${st}/>`,
    backup: `<path d="M3.8 -1.5 A4.2 4.2 0 1 0 3 2.8" ${st}/><path d="M3.8 -4.2 V-1 H0.8" ${st}/>`,
    mfa: `<rect x="-4" y="-0.5" width="8" height="5.5" rx="1" fill="${c}"/><path d="M-2.4 -0.5 V-2.4 A2.4 2.4 0 0 1 2.4 -2.4 V-0.5" ${st}/>`,
    device: `<rect x="-2.8" y="-4.6" width="5.6" height="9.2" rx="1.2" ${st}/><circle cx="0" cy="2.6" r="0.8" fill="${c}"/>`,
    patch: `<path d="M-4 4 L1.5 -1.5" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/><path d="M1 -3.5 A2.8 2.8 0 1 0 4.2 -0.2" ${st}/>`,
    av: `<circle cx="0" cy="0" r="3.6" ${st}/><path d="M0 -6 V-2.5 M0 2.5 V6 M-6 0 H-2.5 M2.5 0 H6" ${st}/>`,
  }[d];
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="7.5" fill="#fffaf0" stroke="#2a2118" stroke-width="1.2"/>${g}</g>`;
}
function tower(d, lv, X, Y, pop) {
  if (!lv) return `<polygon points="${P(Object.values(corners(X, Y, 0.24)))}" fill="rgba(42,33,24,0.12)" stroke="#2a2118" stroke-opacity="0.45" stroke-dasharray="4 3"/>`;
  const col = DEFS[d].color, h = 10 + 12 * lv, r = 14 + 3 * lv;
  let s;
  if (d === "av") {
    // canon : socle, tourelle et fût qui s'allonge avec le niveau
    const bh = 10 + 4 * lv, len = 12 + 5 * lv;
    s = box(X, Y, 0.26, bh, "#6b6f75") + `<ellipse cx="${X}" cy="${Y - bh - 2}" rx="15" ry="9" fill="${col}" stroke="#2a2118" stroke-opacity="0.5"/>` +
      `<line x1="${X}" y1="${Y - bh - 4}" x2="${X - len}" y2="${Y - bh - 4 + len * 0.45}" stroke="#2a2118" stroke-width="${6 + lv}" stroke-linecap="round"/>` +
      `<line x1="${X}" y1="${Y - bh - 4}" x2="${X - len}" y2="${Y - bh - 4 + len * 0.45}" stroke="${shade(col, -0.2)}" stroke-width="${3 + lv}" stroke-linecap="round"/>`;
    s += emblem(d, X + 2, Y - bh + 6);
    s += `<circle cx="${X + 18}" cy="${Y - bh - 6}" r="8" fill="#2a2118" stroke="#f0b429" stroke-width="2"/><text x="${X + 18}" y="${Y - bh - 2}" font-size="11" text-anchor="middle" fill="#fff">${lv}</text>`;
    return `<g class="${pop ? "pop" : ""}">${s}</g>`;
  }
  if (d === "backup") {
    // coffre-fort : large et trapu, cerclé d'or
    const vh = 12 + 7 * lv;
    s = box(X, Y, 0.28, vh, col, shade(col, 0.3));
    for (let k = 1; k <= lv; k++) s += faceR(X, Y, 0.28, 0, 1, (vh * k) / (lv + 1) - 1.5, (vh * k) / (lv + 1) + 1.5, "#f0b429") + faceL(X, Y, 0.28, 0, 1, (vh * k) / (lv + 1) - 1.5, (vh * k) / (lv + 1) + 1.5, "#b7830e");
    s += emblem(d, X, Y + 0.28 * TH - vh * 0.5);
    s += `<circle cx="${X + 18}" cy="${Y - vh + 2}" r="8" fill="#2a2118" stroke="#f0b429" stroke-width="2"/><text x="${X + 18}" y="${Y - vh + 6}" font-size="11" text-anchor="middle" fill="#fff">${lv}</text>`;
    return `<g class="${pop ? "pop" : ""}">${s}</g>`;
  }
  s = box(X, Y, 0.22, h, col) + roof(X, Y, 0.22, h, r, shade(col, -0.35));
  if (lv >= 2) s += faceR(X, Y, 0.22, 0.3, 0.7, h - 12, h - 5, "#2a2118") + faceL(X, Y, 0.22, 0.3, 0.7, h - 12, h - 5, "#2a2118");
  s += emblem(d, X, Y + 0.22 * TH - Math.min(h * 0.45, 16));
  if (lv >= 3) s = `<ellipse class="aura" cx="${X}" cy="${Y}" rx="30" ry="15" fill="url(#g-glow)"/>` + s;
  if (lv >= 3) s += `<line x1="${X}" y1="${Y - h - r}" x2="${X}" y2="${Y - h - r - 14}" stroke="#4a3520" stroke-width="2"/><polygon points="${P([[X, Y - h - r - 14], [X + 12, Y - h - r - 10], [X, Y - h - r - 6]])}" fill="#f0b429"/>`;
  s += `<circle cx="${X + 16}" cy="${Y - h + 2}" r="8" fill="#2a2118" stroke="#f0b429" stroke-width="2"/><text x="${X + 16}" y="${Y - h + 6}" font-size="11" text-anchor="middle" fill="#fff">${lv}</text>`;
  return `<g class="${pop ? "pop" : ""}">${s}</g>`;
}

function fire(X, Y) {
  const f = (dx, sc, cls) => `<path class="flame ${cls}" d="M ${X + dx} ${Y} q ${-8 * sc} ${-10 * sc} 0 ${-26 * sc} q ${8 * sc} ${14 * sc} 0 ${26 * sc} z" fill="#ff8c1a"/>` +
    `<path class="flame ${cls}" d="M ${X + dx} ${Y} q ${-4 * sc} ${-6 * sc} 0 ${-14 * sc} q ${4 * sc} ${8 * sc} 0 ${14 * sc} z" fill="#ffe14d"/>`;
  return `<g>${f(-12, 1, "")}${f(4, 1.3, "b")}${f(16, 0.9, "")}` +
    `<circle class="smoke" cx="${X}" cy="${Y - 30}" r="8" fill="#555"/><circle class="smoke d2" cx="${X + 6}" cy="${Y - 30}" r="8" fill="#555"/></g>`;
}

const PLOT = {};
BUILDINGS.forEach((b, i) => { PLOT[b.id] = [1.5 + 3 * (i % 3), 1.5 + 3 * Math.floor(i / 3)]; });
const SLOTS = [[1.08, 0.12], [0.12, 1.08]];
function towerGrid(d) { const [gx, gy] = PLOT[DEFS[d].b], [ox, oy] = SLOTS[DEFS[d].slot]; return [gx + ox, gy + oy]; }
function towerTop(d, lv) {
  const [X, Y] = iso(...towerGrid(d)), l = Math.max(lv, 1);
  if (d === "av") { const bh = 10 + 4 * l, len = 12 + 5 * l; return [X - len, Y - bh - 4 + len * 0.45]; }
  if (d === "backup") return [X, Y - (12 + 7 * l)];
  return [X, Y - (10 + 12 * l) - 10];
}

function wall(lv, part) {
  if (!lv) return "";
  const a = 0.22, b = 8.78;
  const pts = part === "back" ? [iso(a, b), iso(a, a), iso(b, a)] : [iso(a, b), iso(b, b), iso(b, a)];
  const line = (dy, col, w, extra = "") => `<polyline points="${P(pts.map((p) => [p[0], p[1] - dy]))}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
  let s = "";
  if (lv === 1) {
    s += line(0, "#5e3b17", 3) + line(7, "#8a5a2b", 3) + line(3.5, "#8a5a2b", 5, 'stroke-dasharray="3 12"');
  } else {
    const h = lv === 2 ? 9 : 15;
    for (let y = 0; y < h; y += 2) s += line(y, "#7c838b", 10);
    s += line(h, "#c3c8ce", 9) + line(h + 2, "#8d949c", 3, 'stroke-dasharray="6 6"');
    if (lv === 3) {
      const cs = part === "back" ? [[a, b], [a, a], [b, a]] : [[b, b]];
      cs.forEach(([gx, gy]) => { const [X, Y] = iso(gx, gy); s += box(X, Y, 0.32, 36, "#9aa1a9") + roof(X, Y, 0.32, 36, 18, "#5e6670"); });
    }
  }
  return s;
}

// Décor fixe : touffes d'herbe et arbres
const TUFTS = (() => { let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; const t = []; for (let i = 0; i < 70; i++) t.push([0.3 + rnd() * 8.4, 0.3 + rnd() * 8.4]); return t; })();
const FLOWERS = (() => { let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280; const cols = ["#ffffff", "#ffd23f", "#ff7aa2", "#b58cff"]; const t = []; for (let i = 0; i < 26; i++) { const gx = 0.4 + rnd() * 8.2, gy = 0.4 + rnd() * 8.2; if (Math.abs(gx % 3 - 1.5) > 1.2 || Math.abs(gy % 3 - 1.5) > 1.2) t.push([gx, gy, cols[i % 4]]); } return t; })();
const TREES = [[0.35, 3], [0.35, 6.1], [3, 0.35], [6.1, 0.35], [8.6, 4.5], [4.5, 8.6], [2.9, 2.9], [6.05, 6.05]];
function tree(X, Y, k) {
  return `<ellipse cx="${X}" cy="${Y + 2}" rx="12" ry="5" fill="rgba(0,0,0,0.18)"/><rect x="${X - 2.5}" y="${Y - 14}" width="5" height="15" fill="#6b4423"/>` +
    `<g class="sway" style="animation-delay:${-k * 0.7}s"><circle cx="${X}" cy="${Y - 22}" r="${12 + (k % 2) * 3}" fill="#3f8f3a" stroke="#2a5e26" stroke-width="1.5"/><circle cx="${X + 5}" cy="${Y - 30}" r="${7 + (k % 2) * 2}" fill="#4aa142"/><circle cx="${X - 4}" cy="${Y - 26}" r="5" fill="#6cc25c"/></g>`;
}

// emprise au sol et hauteur de chaque bâtiment, pour l'ombre portée (soleil en haut à gauche)
const FOOT = { hq: [0.75, 70], mail: [0.55, 80], srv: [0.6, 60], wifi: [0.42, 40], compta: [0.65, 60], laptop: [0.55, 30], pc: [0.8, 36], atelier: [0.85, 55], presta: [0.38, 34] };
function castShadow(X, Y, sz, h) {
  const { N, E, S, Wc } = corners(X, Y, sz), d = [h * 0.55, h * 0.1], m = (p) => [p[0] + d[0], p[1] + d[1]];
  return `<polygon points="${P([N, m(N), m(E), m(S), S, Wc])}" fill="rgba(20,40,10,0.22)"/>`;
}
function drawWorld(levels, o = {}) {
  const fires = o.fires || new Set(), mini = !!o.mini, fw = levels.fw || 0;
  const c = [iso(0, 0), iso(9, 0), iso(9, 9), iso(0, 9)];
  let s = "";
  // île
  s += `<polygon points="${P([c[3], c[2], up(c[2], -30), up(c[3], -30)])}" fill="#8b5e34"/>`;
  s += `<polygon points="${P([c[2], c[1], up(c[1], -30), up(c[2], -30)])}" fill="#a8733f"/>`;
  s += `<polygon points="${P([c[3], c[2], up(c[2], -8), up(c[3], -8)])}" fill="#5f8f34"/><polygon points="${P([c[2], c[1], up(c[1], -8), up(c[2], -8)])}" fill="#6ea03d"/>`;
  s += `<polygon points="${P(c)}" fill="${mini ? "#86b94f" : "url(#g-grass)"}"/>`;
  if (!mini) FLOWERS.forEach(([gx, gy, col]) => { const [X, Y] = iso(gx, gy); s += `<circle cx="${X}" cy="${Y}" r="2.4" fill="${col}"/><circle cx="${X + 5}" cy="${Y + 2}" r="2" fill="${col}"/>`; });
  // chemins
  const road = (a1, a2, b1, b2) => `<polygon points="${P([iso(a1, b1), iso(a2, b1), iso(a2, b2), iso(a1, b2)])}" fill="#d9c08a" opacity="0.85"/>`;
  [3, 6].forEach((v) => { s += road(v - 0.16, v + 0.16, 0.4, 8.6) + road(0.4, 8.6, v - 0.16, v + 0.16); });
  if (!mini) [3, 6].forEach((v) => {
    const a = iso(v, 0.4), b = iso(v, 8.6), c = iso(0.4, v), d = iso(8.6, v);
    s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#bfa36b" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>`;
    s += `<line x1="${c[0]}" y1="${c[1]}" x2="${d[0]}" y2="${d[1]}" stroke="#bfa36b" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>`;
  });
  if (!mini) TUFTS.forEach(([gx, gy]) => { const [X, Y] = iso(gx, gy); s += `<path d="M ${X - 3} ${Y} l 2 -5 l 1 5 l 2 -4 l 1 4" fill="none" stroke="#5f8f34" stroke-width="1.3"/>`; });
  s += wall(fw, "back");
  // parcelles
  BUILDINGS.forEach((b) => {
    const [X, Y] = iso(...PLOT[b.id]);
    s += `<polygon points="${P(Object.values(corners(X, Y, 1.3)))}" fill="#79ab44" stroke="#6c9a3b"/>`;
    if (!mini) {
      s += `<polygon points="${P(Object.values(corners(X, Y, 0.98)))}" fill="#cdbf9f" stroke="#a8977a" stroke-width="1.5"/>`;
      const [gx, gy] = PLOT[b.id];
      for (const t of [-0.49, 0, 0.49]) {
        s += `<line x1="${iso(gx + t, gy - 0.98)[0]}" y1="${iso(gx + t, gy - 0.98)[1]}" x2="${iso(gx + t, gy + 0.98)[0]}" y2="${iso(gx + t, gy + 0.98)[1]}" stroke="#b3a383" stroke-width="1"/>`;

    });
  }

  bg += `<g class="boat"><g transform="translate(-340 300)"><path d="M -22 0 L 22 0 L 14 10 L -14 10 Z" fill="#8a5a2b" stroke="#5e3b17"/><line x1="0" y1="0" x2="0" y2="-34" stroke="#5e3b17" stroke-width="2"/><path d="M 1 -32 L 20 -6 L 1 -6 Z" fill="#fffaf0" stroke="#b3a58c"/></g></g>`;
  for (let k = 0; k < 14; k++) {
    const x = -380 + rnd() * 760, y = -80 + rnd() * 480;
    const [gx, gy] = [(x / (TW / 2) + y / (TH / 2)) / 2, (y / (TH / 2) - x / (TW / 2)) / 2];
    if (gx > -1.2 && gx < 10.2 && gy > -1.2 && gy < 10.6) continue;
    bg += `<path class="twinkle" style="animation-delay:${(rnd() * 4).toFixed(2)}s" d="M ${x} ${y - 4} L ${x + 1} ${y - 1} L ${x + 4} ${y} L ${x + 1} ${y + 1} L ${x} ${y + 4} L ${x - 1} ${y + 1} L ${x - 4} ${y} L ${x - 1} ${y - 1} Z" fill="#fff"/>`;
  }
  $("layer-bg").innerHTML = bg;
  const [hx, hy] = iso(...PLOT.hq), [sx, sy] = iso(...PLOT.srv);
  let top = `<g id="tint"><rect x="-395" y="-95" width="790" height="510" fill="rgba(190,30,20,0.18)"/>
    <g class="beam" style="transform-origin:${hx}px ${hy - 80}px"><polygon points="${hx},${hy - 80} ${hx - 150},${hy + 260} ${hx - 40},${hy + 280}" fill="url(#g-beam)"/></g>
    <g class="beam b2" style="transform-origin:${sx}px ${sy - 60}px"><polygon points="${sx},${sy - 60} ${sx + 60},${sy + 280} ${sx + 170},${sy + 250}" fill="url(#g-beam)"/></g></g>`;
  top += `<g class="birds"><g transform="translate(-330 40)"><path class="flap" d="M -8 0 Q -4 -5 0 0 Q 4 -5 8 0" fill="none" stroke="#2a2118" stroke-width="1.6"/><path class="flap" style="animation-delay:.15s" d="M 10 8 Q 14 3 18 8 Q 22 3 26 8" fill="none" stroke="#2a2118" stroke-width="1.6"/></g></g>`;
  [[-300, -60, 1, 0], [60, -40, 0.8, -30], [-120, 360, 1.1, -55]].forEach(([x, y, sc, delay]) => {
    top += `<g class="cloud" style="animation-delay:${delay}s"><g transform="translate(${x} ${y}) scale(${sc})" opacity="0.9">
      <ellipse cx="0" cy="0" rx="46" ry="18" fill="#fff"/><ellipse cx="-26" cy="4" rx="26" ry="13" fill="#fff"/><ellipse cx="28" cy="5" rx="30" ry="12" fill="#fff"/><ellipse cx="4" cy="-12" rx="26" ry="15" fill="#fff"/></g></g>`;
  });
  $("layer-top").innerHTML = top;

  // employés qui se promènent sur l'allée de devant
  const walkers = $("layer-walkers");
  walkers.innerHTML = "";
  const route = [iso(0.9, 8.3), iso(8.3, 8.3), iso(8.3, 0.9)];
  [["#2c6ea8", 0], ["#d2452f", 0.3], ["#27ae60", 0.55], ["#8e44ad", 0.8]].forEach(([shirt, off], k) => {
    const g = document.createElementNS(SVGNS, "g");
    g.innerHTML = `<ellipse cx="0" cy="2" rx="4.5" ry="2" fill="rgba(0,0,0,0.25)"/><g class="bob" style="animation-delay:${k * 0.1}s"><rect x="-3.5" y="-9" width="7" height="10" rx="3" fill="${shirt}"/><circle cx="0" cy="-12" r="3.6" fill="#f1c27d"/></g>`;
    walkers.appendChild(g);
    if (REDUCED) { const p = route[k % 3]; g.setAttribute("transform", `translate(${p[0]} ${p[1]})`); return; }
    g.animate(route.map((p) => ({ transform: `translate(${p[0]}px, ${p[1]}px)` })), { duration: 22000 + k * 3000, iterations: Infinity, direction: "alternate", delay: -off * 22000, easing: "linear" });
  });
}

// ================= démarrage =================
renderScenery();
renderSoundBtn();
seen = { raid: null, step: 0, table: myTable };
renderAll(true);
show(VIEWS.includes(store.get("clash-view")) ? store.get("clash-view") : "base");

(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setStatus("Mode démo local : la partie n'est pas partagée entre les tables sur cet appareil."); return; }
  setStatus("Partie partagée connectée : toutes les tables jouent en direct.");
  let first = true;
  db.doc("game/state").onSnapshot((snap) => {
    if (timers.cfg) return;
    state = normState(snap.exists ? snap.data() : null);
    if (first) { seen = { raid: state.phase === "raid" ? state.current : null, step: state.step, table: myTable }; }
    else checkRaidProgress();
    checkEvent(first); first = false;
    renderAll(false);
  }, () => setStatus("La connexion à la partie s'est interrompue. Rechargez la page."));
  db.collection("tables").onSnapshot((snap) => {
    const next = {};
    snap.docs.forEach((d) => { if (d.exists) next[d.id] = clone(d.data()); });
    if (timers.n && tables[myTable]) next[myTable] = tables[myTable];
    tables = next;
    renderBase(false); renderGiant();
    if (!$("view-mj").hidden && !(document.activeElement && String(document.activeElement.id).startsWith("c-"))) renderMJ();
  }, () => setStatus("La connexion à la partie s'est interrompue. Rechargez la page."));
})();
</script>
