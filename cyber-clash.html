<title>Cyber Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: game board. Resource bar on top, village map (3×3 buildings inside a wall that thickens with the network defenses) beside a context panel (inspection / construction / raid). Single deliberate game look, colors set explicitly. */
:root {
  --sky: #cfe6f3;
  --board: #fffaf0;
  --ink: #2a2118;
  --muted: #6b5d4d;
  --line: #e2d3b8;
  --wood: #8a5a2b;
  --wood-dark: #5e3b17;
  --grass: #86b94f;
  --grass-dark: #5f8f34;
  --stone: #a3a9b1;
  --gold: #f0b429;
  --gold-dark: #b7830e;
  --red: #d2452f;
  --red-bg: #fbe3dd;
  --green: #2f8f46;
  --green-bg: #def2e2;
  --blue: #2c6ea8;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--sky); color: var(--ink); font: 16px/1.45 var(--f-body); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; padding-block: 18px 60px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 2rem; color: var(--wood-dark); }
h2 { font-size: 1.35rem; color: var(--wood-dark); }
h3 { font-size: 1.1rem; }
button { font-family: var(--f-body); }
button:focus-visible, select:focus-visible, input:focus-visible, .tile:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { display: grid; gap: 2px; min-width: 0; }
.brand small { font-weight: 700; color: var(--muted); font-size: 0.85rem; }
.tabs { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font-weight: 800; font-size: 0.95rem; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--wood); background: var(--board); color: var(--wood-dark); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--wood); color: var(--board); }

.banner { margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: var(--wood-dark); color: var(--board); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.banner b { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; color: var(--gold); letter-spacing: 0.02em; }
.status { margin-top: 8px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }

.bar { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.bar label { display: grid; gap: 3px; font-size: 0.8rem; font-weight: 800; color: var(--muted); }
select, input[type="text"], input[type="number"] { font: 700 1rem var(--f-body); color: var(--ink); background: var(--board); border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.bar input[type="text"] { width: 200px; max-width: 100%; }
.res { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; background: var(--board); border: 2px solid var(--line); border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; }
.res i { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font: 400 0.8rem var(--f-display); color: var(--board); font-style: normal; }
.res.gold i { background: var(--gold); color: var(--wood-dark); }
.res.troph i { background: var(--blue); }
.res.hq i { background: var(--wood); }
.res.neg { border-color: var(--red); color: var(--red); }
.spacer { flex: 1; }

.game { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .game { grid-template-columns: minmax(0, 1fr); } }

.village { background: var(--grass); border-radius: 18px; padding: 14px; box-shadow: inset 0 0 0 4px var(--grass-dark); }
.walls { border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; transition: border 0.3s; }
.walls[data-lv="0"] { border: 2px dashed rgba(42, 33, 24, 0.35); }
.walls[data-lv="1"] { border: 6px solid var(--wood); }
.walls[data-lv="2"] { border: 9px double var(--stone); }
.walls[data-lv="3"] { border: 12px ridge var(--stone); }
.wall-cap { margin-top: 8px; font-size: 0.8rem; font-weight: 800; color: var(--wood-dark); text-align: center; }

.tile { position: relative; background: var(--board); border: 3px solid var(--wood); border-radius: 12px; padding: 0 0 8px; min-height: 108px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; overflow: hidden; color: var(--ink); }
.tile .roof { height: 16px; background: var(--roof, var(--red)); border-bottom: 3px solid var(--wood); }
.tile .nm { padding: 0 8px; font: 400 0.98rem/1.1 var(--f-display); letter-spacing: 0.01em; }
.tile .chips { padding: 0 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 0.7rem; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--line); color: var(--wood-dark); overflow-wrap: anywhere; }
.chip.lv1 { background: #f6e3b5; } .chip.lv2 { background: #f0c763; } .chip.lv3 { background: var(--gold-dark); color: var(--board); }
.tile[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue); }
.tile .flag { position: absolute; top: 2px; right: 6px; border: 2px solid var(--board); min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--red); color: var(--board); font-weight: 800; font-size: 0.75rem; display: grid; place-items: center; }
.tile.hit { animation: shake 0.5s; border-color: var(--red); }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.panel { background: var(--board); border: 3px solid var(--wood); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel .sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
.obs { display: grid; gap: 8px; }
.obs button { text-align: left; font-size: 0.95rem; font-weight: 700; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: start; }
.obs button .box { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--wood); display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; }
.obs button[aria-pressed="true"] { border-color: var(--red); background: var(--red-bg); }
.obs button[aria-pressed="true"] .box { background: var(--red); border-color: var(--red); color: #fff; }
.obs button:disabled { cursor: default; }
.obs .verdict { display: block; font-size: 0.82rem; font-weight: 700; margin-top: 3px; }
.verdict.good { color: var(--green); } .verdict.bad { color: var(--red); } .verdict.miss { color: var(--gold-dark); }

.def { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: #fff; }
.def-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 4px; }
.pips span { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--gold-dark); background: #fff; }
.pips span.on { background: var(--gold); }
.lv-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 0.88rem; }
.lv-list li { display: flex; gap: 8px; align-items: baseline; color: var(--muted); }
.lv-list li.done { color: var(--ink); font-weight: 700; }
.lv-list li b { font-variant-numeric: tabular-nums; flex: none; width: 3.2em; color: var(--gold-dark); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font-weight: 800; font-size: 0.92rem; padding: 8px 14px; border-radius: 10px; border: 0; cursor: pointer; }
.btn.gold { background: var(--gold); color: var(--wood-dark); box-shadow: 0 3px 0 var(--gold-dark); }
.btn.plain { background: var(--line); color: var(--wood-dark); }
.btn.red { background: var(--red); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.why { font-size: 0.8rem; color: var(--muted); font-weight: 700; }

.raid { display: grid; gap: 10px; }
.raid .intro { margin: 0; font-weight: 700; }
.stage { border-radius: 10px; padding: 10px 12px; border: 2px solid var(--line); background: #fff; display: grid; gap: 3px; }
.stage .k { font: 400 0.8rem var(--f-display); letter-spacing: 0.04em; color: var(--muted); }
.stage.win { border-color: var(--red); background: var(--red-bg); }
.stage.block { border-color: var(--green); background: var(--green-bg); }
.stage.off { opacity: 0.5; }
.stage .res-line { font-size: 0.86rem; font-weight: 800; }
.stage.win .res-line { color: var(--red); } .stage.block .res-line { color: var(--green); }
.stage .hint { font-size: 0.82rem; color: var(--muted); }
.stars { display: inline-flex; gap: 4px; font-size: 1.6rem; line-height: 1; }
.stars span { color: var(--line); } .stars span.on { color: var(--gold); text-shadow: 0 2px 0 var(--gold-dark); }
.outcome { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--wood-dark); color: var(--board); font-weight: 800; }

/* classement */
.board-box { margin-top: 16px; background: var(--board); border: 3px solid var(--wood); border-radius: 16px; overflow-x: auto; }
table.rank { border-collapse: collapse; width: 100%; min-width: 620px; font-variant-numeric: tabular-nums; }
.rank th, .rank td { padding: 9px 12px; border-bottom: 2px solid var(--line); text-align: center; font-weight: 700; }
.rank th { font: 400 0.85rem var(--f-display); letter-spacing: 0.03em; color: var(--muted); }
.rank td.l, .rank th.l { text-align: left; }
.rank tr:last-child td { border-bottom: 0; }
.rank .pos { font: 400 1.2rem var(--f-display); color: var(--wood); }
.mini-stars { color: var(--gold-dark); letter-spacing: 1px; }
.mini-stars .z { color: var(--green); }
.debrief { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .debrief { grid-template-columns: minmax(0, 1fr); } }
.debrief .panel { gap: 8px; }
.debrief ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 0.9rem; }
.debrief .cnt { font-weight: 800; color: var(--green); }
.empty { margin-top: 16px; padding: 18px; border: 2px dashed var(--wood); border-radius: 14px; color: var(--muted); background: var(--board); font-weight: 700; }

/* maître du jeu */
.mj { margin-top: 16px; display: grid; gap: 16px; }
.mj .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.mj label { display: grid; gap: 3px; font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.mj input[type="number"] { width: 90px; }
.raid-pick { display: grid; gap: 8px; }
.raid-pick .it { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
.raid-pick .it .txt { min-width: 0; flex: 1 1 240px; }
.raid-pick .it .txt div { font-size: 0.85rem; color: var(--muted); }
.raid-pick .it.done { opacity: 0.55; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Cyber Clash</h1>
      <small>Atelier Boisvert SRL · menuiserie de 22 personnes · défendez-la avec les mesures CyFun Small</small>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-base" role="tab" aria-selected="true">Ma base</button>
      <button id="tab-rank" role="tab" aria-selected="false">Classement</button>
      <button id="tab-mj" role="tab" aria-selected="false">Maître du jeu</button>
    </nav>
  </header>

  <div class="banner" id="banner"></div>
  <div class="status" id="status">Connexion à la partie…</div>

  <section id="view-base">
    <div class="bar">
      <label for="sel-table">Table <select id="sel-table"></select></label>
      <label for="in-name">Équipe ou consultant <input type="text" id="in-name" maxlength="30" placeholder="Nom d'équipe"></label>
      <span class="spacer"></span>
      <span class="res gold" id="r-gold"><i>€</i><span></span></span>
      <span class="res troph" id="r-troph"><i>T</i><span></span></span>
      <span class="res hq" id="r-hq"><i>QG</i><span></span></span>
    </div>
    <div class="game">
      <div class="village">
        <div class="walls" id="walls"></div>
        <div class="wall-cap" id="wall-cap"></div>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>

  <section id="view-rank" hidden>
    <div id="rank-body"></div>
  </section>

  <section id="view-mj" hidden>
    <div class="mj" id="mj-body"></div>
  </section>
</div>

<script>
// ---------------- contenu du jeu ----------------
const BUILDINGS = [
  { id: "presta", name: "Accès prestataire", roof: "#6c7a89" },
  { id: "hq", name: "Bureau du gérant", roof: "#c0392b" },
  { id: "compta", name: "Comptabilité", roof: "#8e5bb5" },
  { id: "wifi", name: "Wi-Fi et routeur", roof: "#2c6ea8" },
  { id: "srv", name: "Serveur et NAS", roof: "#34495e" },
  { id: "mail", name: "Messagerie cloud", roof: "#1f8a8a" },
  { id: "laptop", name: "Portable du commercial", roof: "#d35400" },
  { id: "pc", name: "Postes du bureau", roof: "#27ae60" },
  { id: "atelier", name: "Atelier et machine CNC", roof: "#a0522d" },
];

const DEFS = {
  gouv:     { b: "hq", name: "QG cyber", lv: [
    [10, "Un responsable cyber est nommé"],
    [20, "La direction valide une politique et des priorités"],
    [30, "Un CISO (interne ou CISOaaS) pilote, avec une revue chaque trimestre"]] },
  incident: { b: "hq", name: "Plan de crise", lv: [
    [10, "Fiche réflexe : qui appeler, quoi débrancher"],
    [10, "Contacts hors ligne : prestataire, banque, assureur"],
    [15, "Exercice de crise réalisé chaque année"]] },
  access:   { b: "presta", name: "Porte des accès", lv: [
    [10, "Comptes nominatifs, départs désactivés le jour même"],
    [15, "Plus personne n'est administrateur au quotidien"],
    [20, "Accès du prestataire fermé par défaut, ouvert sur demande"]] },
  aware:    { b: "compta", name: "Caserne sensibilisation", lv: [
    [10, "Session de sensibilisation annuelle"],
    [15, "Faux phishing réguliers, signalement en un clic"],
    [15, "Double vérification de tout changement de RIB"]] },
  fw:       { b: "wifi", name: "Remparts réseau", lv: [
    [10, "Mots de passe d'usine changés, pare-feu actif"],
    [10, "Wi-Fi invités séparé du réseau interne"],
    [20, "Réseau de l'atelier séparé du bureau"]] },
  backup:   { b: "srv", name: "Coffre des sauvegardes", lv: [
    [10, "Sauvegarde quotidienne automatique"],
    [15, "Une copie hors ligne ou non modifiable"],
    [15, "Restauration testée chaque trimestre"]] },
  mfa:      { b: "mail", name: "Tour MFA", lv: [
    [15, "Double authentification sur les comptes admin"],
    [15, "Double authentification sur la messagerie de tous"],
    [20, "Double authentification sur tous les accès à distance"]] },
  device:   { b: "laptop", name: "Bouclier mobile", lv: [
    [5, "Code de verrouillage sur portables et smartphones"],
    [10, "Disques des portables chiffrés"],
    [15, "Effacement à distance en cas de perte"]] },
  patch:    { b: "pc", name: "Forge des mises à jour", lv: [
    [10, "Mises à jour automatiques sur les postes"],
    [15, "Serveur, NAS et routeur mis à jour chaque mois"],
    [25, "Systèmes obsolètes remplacés ou isolés"]] },
  av:       { b: "pc", name: "Canon antivirus", lv: [
    [10, "Antivirus actif sur tous les postes"],
    [15, "Les alertes sont lues et traitées"],
    [25, "EDR surveillé par un prestataire"]] },
};
const DEF_IDS = Object.keys(DEFS);

// Observations de la phase « Trouvez les failles ». f = 1 : c'est une faille ; fix = la défense qui la corrige.
const OBS = {
  hq: [
    { id: "hq1", f: 1, t: "Le mot de passe du gérant est sur un post-it sous le clavier.", fix: ["aware", 1] },
    { id: "hq2", f: 0, t: "Les écrans se verrouillent automatiquement après 5 minutes." },
    { id: "hq3", f: 1, t: "Personne ne sait qui appeler si les ordinateurs sont bloqués.", fix: ["incident", 1] },
    { id: "hq4", f: 1, t: "« La cybersécurité, c'est le prestataire qui s'en occupe. »", fix: ["gouv", 1] }],
  mail: [
    { id: "ma1", f: 1, t: "Pas de double authentification sur la messagerie.", fix: ["mfa", 2] },
    { id: "ma2", f: 0, t: "Un filtre anti-spam est activé." },
    { id: "ma3", f: 1, t: "Trois anciens employés ont toujours une boîte mail active.", fix: ["access", 1] }],
  srv: [
    { id: "sr1", f: 1, t: "Le NAS n'a pas été mis à jour depuis 2021.", fix: ["patch", 2] },
    { id: "sr2", f: 1, t: "La seule sauvegarde est un disque USB branché en permanence au serveur.", fix: ["backup", 2] },
    { id: "sr3", f: 0, t: "Le serveur est dans un local fermé à clé." }],
  pc: [
    { id: "pc1", f: 0, t: "Chaque employé a son propre compte Windows." },
    { id: "pc2", f: 1, t: "L'antivirus affiche des alertes que personne ne lit.", fix: ["av", 2] },
    { id: "pc3", f: 1, t: "Tout le monde est administrateur de son poste.", fix: ["access", 2] }],
  wifi: [
    { id: "wi1", f: 1, t: "Les visiteurs utilisent le même Wi-Fi que le personnel.", fix: ["fw", 2] },
    { id: "wi2", f: 0, t: "Le Wi-Fi est en WPA2 avec un mot de passe long." },
    { id: "wi3", f: 1, t: "Le routeur a encore son mot de passe d'usine.", fix: ["fw", 1] }],
  compta: [
    { id: "co1", f: 1, t: "Un changement de RIB fournisseur est accepté sur simple email.", fix: ["aware", 3] },
    { id: "co2", f: 0, t: "Les virements demandent le lecteur de carte de la banque." },
    { id: "co3", f: 1, t: "La comptable n'a jamais entendu parler de phishing.", fix: ["aware", 1] }],
  atelier: [
    { id: "at1", f: 1, t: "Le PC de la CNC tourne sous Windows 7 et est relié au réseau du bureau.", fix: ["fw", 3] },
    { id: "at2", f: 0, t: "Les plans sont enregistrés sur le serveur." },
    { id: "at3", f: 1, t: "Les ouvriers branchent leurs clés USB sur le PC de la CNC pour écouter de la musique.", fix: ["aware", 1] }],
  laptop: [
    { id: "la1", f: 1, t: "Le disque du portable n'est pas chiffré.", fix: ["device", 2] },
    { id: "la2", f: 0, t: "Le portable se connecte au bureau par VPN." },
    { id: "la3", f: 1, t: "Le smartphone qui reçoit les mails pro n'a pas de code.", fix: ["device", 1] }],
  presta: [
    { id: "pr1", f: 1, t: "Le prestataire se connecte par bureau à distance ouvert sur Internet, 24 h/24.", fix: ["access", 3] },
    { id: "pr2", f: 0, t: "Le prestataire a un compte à son nom, non partagé." },
    { id: "pr3", f: 1, t: "Aucun contrat ne précise ses obligations de sécurité.", fix: ["gouv", 2] }],
};
const ALL_OBS = Object.values(OBS).flat();

// Raids : 3 étapes ; chaque étape est bloquée si UNE des défenses listées atteint le niveau indiqué.
const RAIDS = [
  { id: "phish", name: "Raid hameçonnage", hit: ["mail", "hq"],
    intro: "Un faux mail « Votre boîte mail est pleine » arrive chez les 22 employés.",
    steps: [
      ["Un employé clique et saisit son mot de passe", [["aware", 2]]],
      ["L'attaquant se connecte à sa messagerie", [["mfa", 2]]],
      ["Il envoie de fausses factures à vos clients depuis votre adresse", [["incident", 2]]]] },
  { id: "rib", name: "Raid faux RIB", hit: ["compta"],
    intro: "Un fournisseur habituel annonce qu'il « change de banque ».",
    steps: [
      ["La comptabilité reçoit un mail crédible avec un nouveau RIB", []],
      ["Le RIB est modifié sans vérification", [["aware", 3]]],
      ["Un virement de 48 000 € part vers l'escroc", [["incident", 2]]]] },
  { id: "ransom", name: "Raid rançongiciel", hit: ["presta", "srv", "atelier"],
    intro: "Un groupe criminel scanne Internet à la recherche d'accès à distance ouverts.",
    steps: [
      ["Il devine le mot de passe de l'accès du prestataire", [["access", 3], ["mfa", 3]]],
      ["Il se propage jusqu'au serveur et à l'atelier", [["patch", 2], ["av", 2]]],
      ["Tout est chiffré, sauvegardes comprises", [["backup", 2]]]] },
  { id: "laptop", name: "Raid vol de portable", hit: ["laptop"],
    intro: "Le portable du commercial disparaît de sa voiture sur un parking à Liège.",
    steps: [
      ["Le portable est volé", []],
      ["Le voleur lit les devis et le fichier clients", [["device", 2]]],
      ["Il ouvre la messagerie restée connectée", [["device", 3], ["incident", 1]]]] },
  { id: "wifi", name: "Raid Wi-Fi", hit: ["wifi", "srv"],
    intro: "Un visiteur patiente dans la salle d'attente avec son ordinateur portable.",
    steps: [
      ["Il se connecte au routeur avec le mot de passe d'usine", [["fw", 1]]],
      ["Il atteint le NAS qui n'est plus mis à jour", [["fw", 2], ["patch", 2]]],
      ["Il copie les plans et la liste des clients", [["av", 3]]]] },
  { id: "usb", name: "Raid clé USB", hit: ["atelier", "pc"],
    intro: "Une clé USB « Plans 2027 » traîne sur le parking de l'atelier.",
    steps: [
      ["Un ouvrier la branche sur le PC de la CNC", [["aware", 1]]],
      ["Le logiciel malveillant s'installe avec les droits admin", [["av", 1], ["access", 2]]],
      ["Il se propage et arrête la production", [["fw", 3], ["patch", 3]]]] },
];
const RAID_BY_ID = Object.fromEntries(RAIDS.map((r) => [r.id, r]));

const DEFAULT_CFG = { tables: 6, start: 60, bonus: 5, revenue: 40, loss: [0, 10, 25, 45] };
const INITIAL_STATE = { phase: "reco", current: null, step: 0, played: [], results: {}, cfg: DEFAULT_CFG };

// ---------------- utilitaires ----------------
const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const defLabel = (d, l) => `${DEFS[d].name} niv. ${l}`;

let db = null;
let state = clone(INITIAL_STATE);
let tables = {};
let myTable = store.get("clash-table") || "t1";
let selected = store.get("clash-building") || "hq";
let confirmReset = false;

function normState(s) {
  const o = Object.assign(clone(INITIAL_STATE), s || {});
  o.cfg = Object.assign(clone(DEFAULT_CFG), (s && s.cfg) || {});
  if (!Array.isArray(o.cfg.loss) || o.cfg.loss.length !== 4) o.cfg.loss = DEFAULT_CFG.loss.slice();
  o.played = Array.isArray(o.played) ? o.played : [];
  o.results = o.results || {};
  return o;
}
function tbl(id) {
  const t = tables[id] || {};
  return { name: t.name || "", flags: t.flags || {}, levels: t.levels || {} };
}

// ---------------- règles ----------------
function spent(levels) {
  let s = 0;
  DEF_IDS.forEach((d) => { for (let i = 0; i < (levels[d] || 0); i++) s += DEFS[d].lv[i][0]; });
  return s;
}
function reco(flags) {
  let good = 0, bad = 0;
  ALL_OBS.forEach((o) => { if (flags[o.id]) (o.f ? good++ : bad++); });
  return { good, bad, total: ALL_OBS.filter((o) => o.f).length };
}
function recoBonus(flags) {
  if (state.phase === "reco") return 0;
  const r = reco(flags);
  return Math.max(0, (r.good - r.bad) * state.cfg.bonus);
}
function income(tid) {
  let s = 0;
  state.played.forEach((rid) => {
    const res = state.results[rid] && state.results[rid][tid];
    const stars = res ? res.s : 3;
    s += state.cfg.revenue - (state.cfg.loss[stars] || 0);
  });
  return s;
}
function budget(tid) {
  const t = tbl(tid);
  return state.cfg.start + recoBonus(t.flags) + income(tid) - spent(t.levels);
}
function trophies(tid) {
  return state.played.reduce((s, rid) => {
    const res = state.results[rid] && state.results[rid][tid];
    return s + (res ? (3 - res.s) * 10 : 0);
  }, 0);
}
function cap(d, levels) { return d === "gouv" ? 3 : Math.min(3, (levels.gouv || 0) + 1); }
function minLevel(tid, d) {
  // on ne peut pas démolir ce qui était en place lors du dernier raid terminé
  const last = state.played[state.played.length - 1];
  const res = last && state.results[last] && state.results[last][tid];
  return res && res.lv ? (res.lv[d] || 0) : 0;
}
function resolve(raid, levels) {
  for (let i = 0; i < raid.steps.length; i++) {
    const by = raid.steps[i][1].filter(([d, l]) => (levels[d] || 0) >= l);
    if (by.length) return { stars: i, blockedAt: i, by };
  }
  return { stars: 3, blockedAt: -1, by: [] };
}

// ---------------- écriture ----------------
let chain = Promise.resolve();
function queue(fn) {
  if (!db) return;
  chain = chain.then(fn).catch((e) => setStatus(e && e.code === "invalid_argument"
    ? "Vous n'avez pas les droits d'écriture : demandez un accès Contributeur à l'organisateur."
    : "Enregistrement impossible pour l'instant, réessayez dans un instant."));
}
function saveTable(tid) {
  const body = Object.assign(tbl(tid), { updatedAt: new Date().toISOString() });
  queue(() => db.collection("tables").doc(tid).set(clone(body)));
}
function saveState() { const body = clone(state); queue(() => db.doc("game/state").set(body)); }
const timers = {};
function later(k, fn) { clearTimeout(timers[k]); timers[k] = setTimeout(() => { delete timers[k]; fn(); }, 700); }
function mine() {
  if (!tables[myTable]) tables[myTable] = { name: "", flags: {}, levels: {} };
  const t = tables[myTable];
  t.flags = t.flags || {}; t.levels = t.levels || {};
  return t;
}
function setStatus(m) { $("status").textContent = m; }

// ---------------- rendu : bandeau ----------------
function renderBanner() {
  const s = state, n = s.played.length;
  let html;
  if (s.phase === "reco") html = `<b>Phase 1 · Trouvez les failles</b><span>Ouvrez chaque bâtiment et marquez ce qui vous semble dangereux. Chaque faille trouvée rapporte ${s.cfg.bonus} € de budget, chaque fausse alerte en coûte autant.</span>`;
  else if (s.phase === "build") html = `<b>Construction${n ? ` · après ${n} raid${n > 1 ? "s" : ""}` : ""}</b><span>Renforcez votre base avant le prochain raid. Le niveau du QG cyber limite le niveau des autres défenses.</span>`;
  else if (s.phase === "raid") html = `<b>Raid en cours · ${esc(RAID_BY_ID[s.current]?.name || "")}</b><span>La construction est bloquée pendant l'attaque.</span>`;
  else html = `<b>Fin de la partie</b><span>Rendez-vous dans l'onglet Classement pour le débrief.</span>`;
  $("banner").innerHTML = html;
}

// ---------------- rendu : ma base ----------------
function renderTableSelect() {
  const sel = $("sel-table");
  if (Number(myTable.slice(1)) > state.cfg.tables) myTable = "t1";
  sel.innerHTML = "";
  for (let i = 1; i <= state.cfg.tables; i++) {
    const o = document.createElement("option");
    o.value = "t" + i; o.textContent = "Table " + i + (tables["t" + i]?.name ? " · " + tables["t" + i].name : "");
    sel.appendChild(o);
  }
  sel.value = myTable;
}
$("sel-table").addEventListener("change", (e) => {
  myTable = e.target.value; store.set("clash-table", myTable); renderBase(true);
});
$("in-name").addEventListener("input", (e) => { mine().name = e.target.value; later("n", () => saveTable(myTable)); });

function renderRes() {
  const b = budget(myTable), t = tbl(myTable);
  $("r-gold").querySelector("span").textContent = b + " €";
  $("r-gold").classList.toggle("neg", b < 0);
  $("r-troph").querySelector("span").textContent = trophies(myTable) + " trophées";
  $("r-hq").querySelector("span").textContent = "niveau " + (t.levels.gouv || 0);
}

function renderVillage() {
  const t = tbl(myTable);
  const walls = $("walls");
  const fw = t.levels.fw || 0;
  walls.dataset.lv = String(fw);
  $("wall-cap").textContent = fw ? `Remparts réseau niveau ${fw}` : "Aucun rempart réseau";
  const raid = state.phase === "raid" ? RAID_BY_ID[state.current] : null;
  walls.innerHTML = "";
  BUILDINGS.forEach((b) => {
    const el = document.createElement("button");
    el.className = "tile" + (raid && raid.hit.includes(b.id) && state.step > 0 ? " hit" : "");
    el.style.setProperty("--roof", b.roof);
    el.setAttribute("aria-pressed", String(selected === b.id));
    const chips = DEF_IDS.filter((d) => DEFS[d].b === b.id)
      .map((d) => { const l = t.levels[d] || 0; return `<span class="chip lv${l}">${esc(DEFS[d].name)} ${l}</span>`; }).join("");
    const nFlags = (OBS[b.id] || []).filter((o) => t.flags[o.id]).length;
    el.innerHTML = `<span class="roof"></span><span class="nm">${esc(b.name)}</span><span class="chips">${chips}</span>${nFlags ? `<span class="flag" title="Failles marquées">${nFlags}</span>` : ""}`;
    el.onclick = () => { selected = b.id; store.set("clash-building", selected); renderVillage(); renderPanel(); };
    walls.appendChild(el);
  });
}

function renderPanel() {
  const p = $("panel");
  if (state.phase === "raid" && RAID_BY_ID[state.current]) { p.innerHTML = raidHTML(RAID_BY_ID[state.current], tbl(myTable).levels, state.step); return; }
  const b = BUILDINGS.find((x) => x.id === selected) || BUILDINGS[0];
  const t = tbl(myTable);
  let html = `<h2>${esc(b.name)}</h2>`;

  // observations
  const obs = OBS[b.id] || [];
  if (state.phase === "reco") {
    html += `<p class="sub">Inspection : touchez les constats qui sont des failles.</p><div class="obs">`;
    obs.forEach((o) => {
      html += `<button data-obs="${o.id}" aria-pressed="${!!t.flags[o.id]}"><span class="box">${t.flags[o.id] ? "!" : ""}</span><span>${esc(o.t)}</span></button>`;
    });
    html += `</div>`;
  } else {
    html += `<p class="sub">Constats de l'inspection</p><div class="obs">`;
    obs.forEach((o) => {
      const flagged = !!t.flags[o.id];
      let v;
      if (o.f && flagged) v = `<span class="verdict good">Faille trouvée · se corrige avec ${esc(defLabel(...o.fix))}</span>`;
      else if (o.f) v = `<span class="verdict miss">Faille manquée · se corrige avec ${esc(defLabel(...o.fix))}</span>`;
      else if (flagged) v = `<span class="verdict bad">Fausse alerte : c'est une bonne pratique</span>`;
      else v = `<span class="verdict good">Bonne pratique</span>`;
      html += `<button disabled aria-pressed="${flagged}"><span class="box">${flagged ? "!" : ""}</span><span>${esc(o.t)}${v}</span></button>`;
    });
    html += `</div>`;
  }

  // défenses
  const defs = DEF_IDS.filter((d) => DEFS[d].b === b.id);
  if (!defs.length) {
    html += `<p class="sub">Aucune défense ne se construit ici. L'atelier est protégé par les Remparts réseau (niveau 3 : réseau séparé) et la Forge des mises à jour (niveau 3 : systèmes obsolètes isolés).</p>`;
  }
  defs.forEach((d) => {
    const l = t.levels[d] || 0, def = DEFS[d];
    const next = def.lv[l];
    const c = cap(d, t.levels), bud = budget(myTable), min = minLevel(myTable, d);
    let why = "";
    const canBuild = state.phase === "build" && next && l < c && next[0] <= bud;
    if (state.phase === "reco") why = "Construction après la phase d'inspection.";
    else if (state.phase !== "build") why = "";
    else if (!next) why = "Niveau maximum atteint.";
    else if (l >= c) why = `Montez le QG cyber au niveau ${l} pour débloquer.`;
    else if (next[0] > bud) why = `Il manque ${next[0] - bud} €.`;
    html += `<div class="def"><div class="def-head"><h3>${esc(def.name)}</h3><span class="pips">${[1, 2, 3].map((i) => `<span class="${i <= l ? "on" : ""}"></span>`).join("")}</span></div>
      <ul class="lv-list">${def.lv.map(([cost, txt], i) => `<li class="${i < l ? "done" : ""}"><b>${cost} €</b><span>Niv. ${i + 1} · ${esc(txt)}</span></li>`).join("")}</ul>
      <div class="actions">
        ${next ? `<button class="btn gold" data-up="${d}" ${canBuild ? "" : "disabled"}>Améliorer · ${next[0]} €</button>` : ""}
        ${state.phase === "build" && l > min ? `<button class="btn plain" data-down="${d}">Annuler le niveau ${l}</button>` : ""}
        ${why ? `<span class="why">${why}</span>` : ""}
      </div></div>`;
  });
  p.innerHTML = html;

  p.querySelectorAll("[data-obs]").forEach((btn) => btn.onclick = () => {
    if (state.phase !== "reco") return;
    const m = mine(), id = btn.dataset.obs;
    if (m.flags[id]) delete m.flags[id]; else m.flags[id] = true;
    renderVillage(); renderPanel(); saveTable(myTable);
  });
  p.querySelectorAll("[data-up]").forEach((btn) => btn.onclick = () => {
    const d = btn.dataset.up, m = mine(), l = m.levels[d] || 0, next = DEFS[d].lv[l];
    if (state.phase !== "build" || !next || l >= cap(d, m.levels) || next[0] > budget(myTable)) return;
    m.levels[d] = l + 1;
    renderBase(false); saveTable(myTable);
  });
  p.querySelectorAll("[data-down]").forEach((btn) => btn.onclick = () => {
    const d = btn.dataset.down, m = mine(), l = m.levels[d] || 0;
    if (state.phase !== "build" || l <= minLevel(myTable, d)) return;
    // démolir le QG ne doit pas laisser des défenses au-dessus du plafond
    if (d === "gouv" && DEF_IDS.some((x) => x !== "gouv" && (m.levels[x] || 0) > l)) {
      setStatus("Baissez d'abord les défenses qui dépassent le niveau autorisé par le QG."); return;
    }
    m.levels[d] = l - 1;
    renderBase(false); saveTable(myTable);
  });
}

function starsHTML(n) { return `<span class="stars" aria-label="${n} étoile${n > 1 ? "s" : ""} sur 3">${[0, 1, 2].map((i) => `<span class="${i < n ? "on" : ""}">★</span>`).join("")}</span>`; }

function raidHTML(raid, levels, step) {
  const r = resolve(raid, levels);
  let html = `<div class="raid"><h2>${esc(raid.name)}</h2><p class="intro">${esc(raid.intro)}</p>`;
  raid.steps.forEach(([txt, blockers], i) => {
    const shown = i < step;
    let cls = "stage", line = "";
    const alt = blockers.length ? "Bloqué par : " + blockers.map((b) => defLabel(...b)).join(" ou ") : "Rien ne peut empêcher cette étape.";
    if (!shown) { cls += " off"; line = `<span class="hint">En attente du maître du jeu…</span>`; }
    else if (r.blockedAt >= 0 && i > r.blockedAt) { cls += " off"; line = `<span class="res-line">L'attaque s'est arrêtée avant.</span>`; }
    else if (i === r.blockedAt) { cls += " block"; line = `<span class="res-line">Bloqué par ${esc(r.by.map((b) => defLabel(...b)).join(" et "))}</span>`; }
    else { cls += " win"; line = `<span class="res-line">L'attaquant passe.</span><span class="hint">${esc(alt)}</span>`; }
    html += `<div class="${cls}"><span class="k">Étape ${i + 1}</span><span>${esc(txt)}</span>${line}</div>`;
  });
  if (step >= 3) {
    const loss = state.cfg.loss[r.stars];
    html += `<div class="outcome">${starsHTML(r.stars)}<span>${r.stars === 0 ? "Attaque repoussée" : r.stars === 3 ? "Base détruite" : "Base touchée"} · +${(3 - r.stars) * 10} trophées · ${loss ? "−" + loss + " € de pertes" : "aucune perte"}</span></div>`;
  }
  return html + `</div>`;
}

function renderBase(sync) {
  renderTableSelect();
  const n = $("in-name");
  if (sync || document.activeElement !== n) n.value = tbl(myTable).name;
  renderRes(); renderVillage(); renderPanel();
}

// ---------------- rendu : classement ----------------
function tableIds() { return Array.from({ length: state.cfg.tables }, (_, i) => "t" + (i + 1)); }
function renderRank() {
  const ids = tableIds();
  const rows = ids.map((id) => ({ id, t: tbl(id), tr: trophies(id), b: budget(id), r: reco(tbl(id).flags) }))
    .sort((a, b) => b.tr - a.tr || b.b - a.b);
  const showReco = state.phase !== "reco";
  let html = `<div class="board-box"><table class="rank"><thead><tr><th>#</th><th class="l">Table</th><th>Trophées</th>`;
  state.played.forEach((rid) => { html += `<th>${esc(RAID_BY_ID[rid].name.replace("Raid ", ""))}</th>`; });
  html += `<th>Budget</th><th>${showReco ? "Failles trouvées" : "Failles marquées"}</th></tr></thead><tbody>`;
  rows.forEach((x, i) => {
    html += `<tr><td class="pos">${i + 1}</td><td class="l">Table ${x.id.slice(1)}${x.t.name ? " · " + esc(x.t.name) : ""}</td><td>${x.tr}</td>`;
    state.played.forEach((rid) => {
      const res = state.results[rid]?.[x.id];
      const s = res ? res.s : 3;
      html += `<td class="mini-stars" title="${s} étoile(s) pour l'attaquant">${s === 0 ? '<span class="z">repoussé</span>' : "★".repeat(s)}</td>`;
    });
    html += `<td>${x.b} €</td><td>${showReco ? `${x.r.good} / ${x.r.total}${x.r.bad ? ` · ${x.r.bad} fausse${x.r.bad > 1 ? "s" : ""} alerte${x.r.bad > 1 ? "s" : ""}` : ""}` : Object.keys(x.t.flags).length}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  html += `<p class="status">Étoiles gagnées par l'attaquant : 0 = attaque repoussée, 3 = base détruite. Chaque étoile évitée rapporte 10 trophées.</p>`;

  if (!state.played.length) {
    html += `<div class="empty">Le débrief des raids apparaîtra ici après le premier raid.</div>`;
  } else {
    html += `<h2 style="margin-top:22px">Débrief des raids</h2><div class="debrief">`;
    state.played.forEach((rid) => {
      const raid = RAID_BY_ID[rid], res = state.results[rid] || {};
      const blockedAt = [0, 0, 0];
      ids.forEach((id) => { const s = res[id] ? res[id].s : 3; if (s < 3) blockedAt[s]++; });
      html += `<article class="panel"><h3>${esc(raid.name)}</h3><p class="sub">${esc(raid.intro)}</p><ol>`;
      raid.steps.forEach(([txt, bl], i) => {
        html += `<li>${esc(txt)}<br><span class="why">${bl.length ? "Parade : " + esc(bl.map((b) => defLabel(...b)).join(" ou ")) : "Aucune parade : il faut limiter la suite."}</span>${blockedAt[i] ? ` <span class="cnt">· stoppé ici par ${blockedAt[i]} table${blockedAt[i] > 1 ? "s" : ""}</span>` : ""}</li>`;
      });
      html += `</ol></article>`;
    });
    html += `</div>`;
  }
  $("rank-body").innerHTML = html;
}

// ---------------- rendu : maître du jeu ----------------
function renderMJ() {
  const s = state, box = $("mj-body");
  let html = `<div class="panel"><h2>Déroulé de la partie</h2>`;
  if (s.phase === "reco") {
    const started = tableIds().filter((id) => Object.keys(tbl(id).flags).length).length;
    html += `<p class="sub">Les tables inspectent la base. ${started} table${started > 1 ? "s ont" : " a"} commencé à marquer des failles.</p>
      <div class="actions"><button class="btn gold" id="mj-reveal">Révéler les failles et ouvrir la construction</button></div>`;
  } else if (s.phase === "raid") {
    const raid = RAID_BY_ID[s.current];
    html += `<p class="sub">${esc(raid.name)} · étape ${Math.min(s.step, 3)} sur 3 révélée.</p><div class="actions">
      ${s.step < 3 ? `<button class="btn red" id="mj-step">Révéler l'étape ${s.step + 1}</button>` : `<button class="btn gold" id="mj-close">Terminer le raid et verser les revenus</button>`}</div>`;
  } else if (s.phase === "build") {
    html += `<p class="sub">Les tables construisent. Choisissez le prochain raid quand vous êtes prêt : il est joué contre toutes les bases en même temps.</p><div class="raid-pick">`;
    RAIDS.forEach((r) => {
      const done = s.played.includes(r.id);
      html += `<div class="it ${done ? "done" : ""}"><div class="txt"><b>${esc(r.name)}</b><div>${esc(r.intro)}</div></div>
        ${done ? `<span class="why">Déjà joué</span>` : `<button class="btn red" data-launch="${r.id}">Lancer</button>`}</div>`;
    });
    html += `</div><div class="actions" style="margin-top:6px"><button class="btn plain" id="mj-end">Terminer la partie</button></div>`;
  } else {
    html += `<p class="sub">Partie terminée après ${s.played.length} raid${s.played.length > 1 ? "s" : ""}. Le classement et le débrief sont prêts.</p>
      <div class="actions"><button class="btn plain" id="mj-reopen">Rouvrir la construction</button></div>`;
  }
  html += `</div>`;

  html += `<div class="panel"><h2>Réglages</h2><p class="sub">Modifiables à tout moment. Les budgets se recalculent pour toutes les tables.</p><div class="mj row">
    <label for="c-tables">Tables<input type="number" id="c-tables" min="1" max="12" value="${s.cfg.tables}"></label>
    <label for="c-start">Budget de départ (€)<input type="number" id="c-start" min="0" max="500" value="${s.cfg.start}"></label>
    <label for="c-bonus">Gain par faille (€)<input type="number" id="c-bonus" min="0" max="50" value="${s.cfg.bonus}"></label>
    <label for="c-revenue">Revenu après chaque raid (€)<input type="number" id="c-revenue" min="0" max="200" value="${s.cfg.revenue}"></label>
    ${[1, 2, 3].map((k) => `<label for="c-loss${k}">Perte à ${k} étoile${k > 1 ? "s" : ""} (€)<input type="number" id="c-loss${k}" min="0" max="200" value="${s.cfg.loss[k]}"></label>`).join("")}
  </div></div>`;

  html += `<div class="panel"><h2>Nouvelle partie</h2><p class="sub">Remet la partie au début et vide les bases de toutes les tables.</p><div class="actions" id="mj-reset-zone">
    ${confirmReset ? `<span class="confirm">Tout effacer ? <button class="btn red" id="mj-reset-yes">Effacer et recommencer</button><button class="btn plain" id="mj-reset-no">Annuler</button></span>` : `<button class="btn plain" id="mj-reset">Recommencer la partie</button>`}
  </div></div>`;

  const focused = document.activeElement && document.activeElement.id;
  box.innerHTML = html;
  if (focused && $(focused) && focused.startsWith("c-")) { const el = $(focused); el.focus(); }

  const on = (id, fn) => { if ($(id)) $(id).onclick = fn; };
  on("mj-reveal", () => { state.phase = "build"; commit(); });
  on("mj-step", () => { state.step = Math.min(3, state.step + 1); commit(); });
  on("mj-close", () => {
    const rid = state.current, res = {};
    tableIds().forEach((id) => { const lv = clone(tbl(id).levels); res[id] = { s: resolve(RAID_BY_ID[rid], lv).stars, lv }; });
    state.results[rid] = res;
    state.played = state.played.concat(rid);
    state.phase = "build"; state.current = null; state.step = 0;
    commit();
  });
  box.querySelectorAll("[data-launch]").forEach((b) => b.onclick = () => {
    state.phase = "raid"; state.current = b.dataset.launch; state.step = 0; commit();
  });
  on("mj-end", () => { state.phase = "end"; commit(); });
  on("mj-reopen", () => { state.phase = "build"; commit(); });
  on("mj-reset", () => { confirmReset = true; renderMJ(); });
  on("mj-reset-no", () => { confirmReset = false; renderMJ(); });
  on("mj-reset-yes", () => {
    confirmReset = false;
    const cfg = clone(state.cfg);
    state = normState({ cfg });
    tableIds().forEach((id) => { tables[id] = { name: tbl(id).name, flags: {}, levels: {} }; saveTable(id); });
    commit();
  });

  const num = (id, fn) => $(id).addEventListener("input", (e) => {
    if (e.target.value === "") return;
    const v = Math.max(0, Math.round(Number(e.target.value)));
    if (!Number.isFinite(v)) return;
    fn(v); renderAllButMJ(); later("cfg", saveState);
  });
  num("c-tables", (v) => { state.cfg.tables = Math.min(12, Math.max(1, v)); });
  num("c-start", (v) => { state.cfg.start = v; });
  num("c-bonus", (v) => { state.cfg.bonus = v; });
  num("c-revenue", (v) => { state.cfg.revenue = v; });
  [1, 2, 3].forEach((k) => num("c-loss" + k, (v) => { state.cfg.loss[k] = v; }));
}

function commit() { renderAll(false); saveState(); }

// ---------------- navigation ----------------
const VIEWS = ["base", "rank", "mj"];
function show(v) {
  VIEWS.forEach((x) => { $("view-" + x).hidden = x !== v; $("tab-" + x).setAttribute("aria-selected", String(x === v)); });
  store.set("clash-view", v);
}
VIEWS.forEach((v) => $("tab-" + v).onclick = () => show(v));

function renderAllButMJ() { renderBanner(); renderBase(false); renderRank(); }
function renderAll(sync) { renderBanner(); renderBase(sync); renderRank(); renderMJ(); }

// ---------------- démarrage ----------------
renderAll(true);
show(VIEWS.includes(store.get("clash-view")) ? store.get("clash-view") : "base");

(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setStatus("Mode démo local : la partie n'est pas partagée entre les tables sur cet appareil."); return; }
  setStatus("Partie partagée connectée : toutes les tables jouent en direct.");
  db.doc("game/state").onSnapshot((snap) => {
    if (timers.cfg) return;
    state = normState(snap.exists ? snap.data() : null);
    renderAll(false);
  }, () => setStatus("La connexion à la partie s'est interrompue. Rechargez la page."));
  db.collection("tables").onSnapshot((snap) => {
    const next = {};
    snap.docs.forEach((d) => { if (d.exists) next[d.id] = clone(d.data()); });
    if (timers.n && tables[myTable]) next[myTable] = tables[myTable];
    tables = next;
    renderBase(false); renderRank();
    if (!$("view-mj").hidden && !(document.activeElement && String(document.activeElement.id).startsWith("c-"))) renderMJ();
  }, () => setStatus("La connexion à la partie s'est interrompue. Rechargez la page."));
})();
</script>
